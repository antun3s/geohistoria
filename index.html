<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoHistória</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <h1 class="logo">GeoHistória</h1>
        </header>

        <section id="start-screen" class="screen screen--active">
            <div class="card card--centered">
                <h2>Descubra a personalidade histórica</h2>
                <p>Use as pistas de tempo e lugar para identificar quem é.</p>
                <button id="start-button" class="button button--primary">Iniciar Partida</button>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div class="hud">
                <div class="hud__item">
                    <span class="hud__label">Vidas</span>
                    <span id="lives-display" class="hud__value">3</span>
                </div>
                <div class="hud__item">
                    <span class="hud__label">Pulos</span>
                    <span id="skips-display" class="hud__value">3</span>
                </div>
                <div class="hud__item">
                    <span class="hud__label">Acertos</span>
                    <span id="score-display" class="hud__value">0</span>
                </div>
            </div>

            <div id="map" class="map" role="img" aria-label="Mapa com local de nascimento e morte da personalidade"></div>

            <div class="clues">
                <div class="clue">
                    <span class="clue__label">Nascimento</span>
                    <span id="birth-year" class="clue__year">-</span>
                    <span id="birth-place" class="clue__place">-</span>
                </div>
                <div class="clue">
                    <span class="clue__label">Morte</span>
                    <span id="death-year" class="clue__year">-</span>
                    <span id="death-place" class="clue__place">-</span>
                </div>
            </div>

            <form id="answer-form" class="answer-form">
                <label for="answer-input" class="visually-hidden">Quem é essa personalidade?</label>
                <input id="answer-input" type="text" class="answer-input"
                       placeholder="Digite o nome..." autocomplete="off" autofocus>
                <div class="answer-actions">
                    <button type="submit" class="button button--primary">Responder</button>
                    <button id="skip-button" type="button" class="button button--secondary">Pular</button>
                </div>
            </form>

            <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <section id="end-screen" class="screen">
            <div class="card">
                <h2 id="end-title">Partida Encerrada</h2>
                <div class="summary">
                    <div class="summary__item">
                        <span class="summary__label">Acertos</span>
                        <span id="end-correct" class="summary__value">0</span>
                    </div>
                    <div class="summary__item">
                        <span class="summary__label">Erros</span>
                        <span id="end-wrong" class="summary__value">0</span>
                    </div>
                    <div class="summary__item">
                        <span class="summary__label">Pulos</span>
                        <span id="end-skips" class="summary__value">0</span>
                    </div>
                </div>

                <div id="wrong-answers-section" class="learning">
                    <h3>Revise as personalidades que você errou</h3>
                    <ul id="wrong-answers-list" class="learning__list"></ul>
                </div>

                <button id="restart-button" class="button button--primary">Jogar Novamente</button>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="js/validator.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
